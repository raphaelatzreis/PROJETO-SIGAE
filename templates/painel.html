<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGAE — Painel de Chamadas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e5484d'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
</head>
<body>
  <div class="tv">
    <header class="tv-top">
      <a class="tv-brand" href="{{ url_for('index') }}" title="Voltar ao painel do operador">SIGAE</a>
      <span class="tv-clock" id="tv-time">--:--</span>
    </header>

    <main class="tv-main">
      <section class="tv-current" id="tv-current" aria-live="assertive"></section>

      <aside class="tv-side">
        <h2>Últimas chamadas</h2>
        <ul class="tv-history" id="tv-history"></ul>
      </aside>
    </main>
  </div>

  <!-- Navegadores exigem um clique antes de tocar áudio -->
  <div class="tv-unlock" id="tv-unlock">
    <button type="button" id="btn-unlock">
      <strong>Iniciar telão</strong>
      <span>Clique para abrir em tela cheia e ativar o som e a voz</span>
    </button>
  </div>

  <script>window.__INITIAL_STATE__ = {{ estado | tojson }};</script>
  <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
  <script src="{{ url_for('static', filename='js/painel.js') }}"></script>
</body>
</html>
